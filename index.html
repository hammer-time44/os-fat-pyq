<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OS FAT Papers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 800px column. Left sidebar of papers that hides after a pick. Fixed bottom bar searches a question number in the open paper. */
:root{
  --bg:#ffffff; --fg:#0b0b0c; --mute:#6c6c73; --line:#ececee; --imgf:none;
  --blue:#2457ff; --violet:#7a3df0; --pink:#d62a7a; --amber:#c97400; --green:#15935a; --cyan:#0a86a8; --rose:#e03e45;
  --accent:var(--blue);
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09090a; --fg:#ededee; --mute:#97979f; --line:#1f1f23; --imgf:brightness(.86);
  --blue:#7f9bff; --violet:#a98bff; --pink:#ff7ab5; --amber:#f2b038; --green:#4cd199; --cyan:#3cc6e6; --rose:#ff8086; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090a; --fg:#ededee; --mute:#97979f; --line:#1f1f23; --imgf:brightness(.86);
  --blue:#7f9bff; --violet:#a98bff; --pink:#ff7ab5; --amber:#f2b038; --green:#4cd199; --cyan:#3cc6e6; --rose:#ff8086; color-scheme:dark}
:root[data-c="blue"]{--accent:var(--blue)}:root[data-c="violet"]{--accent:var(--violet)}:root[data-c="pink"]{--accent:var(--pink)}
:root[data-c="amber"]{--accent:var(--amber)}:root[data-c="green"]{--accent:var(--green)}:root[data-c="cyan"]{--accent:var(--cyan)}:root[data-c="rose"]{--accent:var(--rose)}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--fg);font:400 14.5px/1.6 var(--body);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.hide{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* sidebar */
#side{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--bg);border-right:1px solid var(--line);z-index:30;display:flex;flex-direction:column;padding:28px 0 20px;transform:translateX(0);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
#side.off{transform:translateX(-100%)}
#side h2{margin:0 20px 18px;font:600 12.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
#side ul{list-style:none;margin:0;padding:0;flex:1;overflow:auto}
#side li a{display:flex;align-items:center;gap:12px;padding:9px 20px;text-decoration:none;font:600 12.5px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;--c:var(--blue)}
#side li a i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
#side li a[aria-current="true"]{background:color-mix(in srgb,var(--c) 8%,transparent)}
#side li small{margin-left:auto;font:500 11.5px var(--body);letter-spacing:0;text-transform:none;color:var(--mute)}
#theme{margin:12px 20px 0;font:500 12.5px var(--body);color:var(--mute);text-decoration:underline;text-underline-offset:3px;width:max-content}
#edge{position:fixed;left:0;top:50%;width:3px;height:56px;margin-top:-28px;background:var(--accent);z-index:29;opacity:0;transition:opacity .2s}
#side.off ~ #edge{opacity:1}

/* mobile tabs */
#tabs{display:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:41}

main{max-width:800px;margin:0 auto;padding-block:64px 150px}
.top{margin-bottom:34px}
h1{margin:0;font:800 clamp(40px,8vw,68px)/.95 var(--display);letter-spacing:-.045em;text-transform:uppercase;color:var(--accent);display:flex;flex-wrap:wrap;column-gap:.3em}
h1 .w{display:inline-flex;overflow:hidden;padding-bottom:.06em}
h1 .l{display:inline-block;animation:rise .2s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*22ms)}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.full{margin:14px 0 0;font:400 15px/1.5 var(--body);color:var(--mute)}
.facts{margin:6px 0 0;font:500 12.5px/1.5 var(--body);color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 18px}
.facts a{text-underline-offset:3px}

.label{margin:44px 0 0;font:600 12.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
ol.rows{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
ol.rows li{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:0 8px;align-items:baseline;width:100%;padding:20px 0}
.row .n{font:700 13px/1.4 var(--body);color:var(--accent);font-variant-numeric:tabular-nums}
.row .t{display:block;font:700 16.5px/1.35 var(--body)}
.row .d{display:block;margin-top:3px;font:400 13.5px/1.7 var(--body);color:var(--mute)}
.row .m{font:500 12.5px/1.4 var(--body);color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.row:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}

.pages{margin-top:0;display:flex;flex-direction:column;gap:18px}
.pg{position:relative;width:100%}
.pg img{display:block;width:100%;height:auto;filter:var(--imgf);outline:1px solid var(--line)}
.pg .cap{position:absolute;right:0;bottom:-16px;font:500 11.5px/1 var(--body);color:var(--mute);display:none}
.mark{transition:opacity .2s;position:absolute;left:0;right:0;height:0;border-top:2px solid var(--accent);pointer-events:none;z-index:2}
.mark b{position:absolute;left:0;top:-24px;font:700 12.5px/1 var(--body);color:var(--accent);background:var(--bg);padding:4px 7px 4px 0}

.pn{margin-top:56px;display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:20px}
.pn a{font:600 12.5px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;display:flex;flex-direction:column;gap:4px;--c:var(--blue)}
.pn a span{font:400 12.5px var(--body);letter-spacing:0;text-transform:none;color:var(--mute)}
.pn a b{color:var(--c)}
.pn .nx{text-align:right;margin-left:auto}

/* search */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#bar form{max-width:800px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px}
#bar label{font:700 13px/1 var(--body);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
#q{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;font:500 16px/1.3 var(--body);border-radius:0;outline-offset:6px}
#q::placeholder{color:var(--mute);opacity:1}
#q:focus{border-bottom-color:var(--accent)}
#st{font:500 12.5px/1.3 var(--body);color:var(--mute);text-align:right;min-width:0;max-width:44vw}
#st em{font-style:normal;color:var(--accent);font-weight:700}

@media (max-width:820px){
  #side,#edge{display:none}
  #tabs{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;gap:20px}
  #tabs::-webkit-scrollbar{display:none}
  #tabs a{flex:none;padding:14px 0;font:600 12.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--mute);--c:var(--blue)}
  #tabs a[aria-current="true"]{color:var(--c)}
  main{padding-block:28px 140px}
  #st{max-width:38vw}
}
@media (max-width:480px){.row{grid-template-columns:34px minmax(0,1fr) auto}#bar form{gap:10px}#bar label span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<aside id="side" aria-label="Papers"><h2>FAT · BCSE303L</h2><ul id="sl"></ul><button id="theme" type="button">Switch theme</button></aside>

</div>

-24.pdf", "pages": [{"src": "img/B1-23-24-1.jpg", "w": 1100, "h": 1541}, {"src": "img/B1-23-24-2.jpg", "w": 1100, "h": 1560}, {"src": "img/B1-23-24-3.jpg", "w": 1100, "h": 1556}], "rows": [{"n": "1", "t": "OS structures and dual mode", "d": "Structures with sketch; need for dual-mode operation", "pg": 1}, {"n": "2", "t": "System calls and threads", "d": "System programs; user vs kernel threads", "pg": 1}, {"n": "3", "t": "CPU scheduling", "d": "FCFS, SJF, priority and RR (quantum 2)", "pg": 1}, {"n": "4", "t": "Banker’s algorithm", "d": "Need matrix, safe sequence, request from P4", "pg": 1}, {"n": "5", "t": "Critical section and semaphores", "d": "Mutual exclusion check; counting “print 0”", "pg": 2}, {"n": "6", "t": "Readers–writers", "d": "Critical section problem with semaphores", "pg": 2}, {"n": "7", "t": "Memory", "d": "Effective access time with TLB; first, best, worst fit", "pg": 2}, {"n": "8", "t": "Page replacement", "d": "FIFO, Optimal and LRU on four frames", "pg": 2}, {"n": "9", "t": "Hypervisors and file allocation", "d": "Compare Xen, KVM, Oracle VM, ESXi; allocation methods", "pg": 3}, {"n": "10", "t": "Disk scheduling", "d": "FCFS, SSTF, SCAN and LOOK with the arm at 60", "pg": 3}], "q": {"1": [1, 0.233], "2": [1, 0.31], "3": [1, 0.36], "4": [1, 0.62], "5": [2, 0.1], "6": [2, 0.588], "7": [2, 0.633], "8": [2, 0.785], "9": [3, 0.06], "10": [3, 0.36]}}];
const $=s=>document.getElementById(s), root=document.documentElement;
let cur=0, mark=null, wide=()=>matchMedia("(min-width:821px)").matches;

// theme
(function(){try{const t=localStorage.getItem("fat-theme");if(t)root.dataset.theme=t}catch(e){}})();
$("theme").onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  const n=dark?"light":"dark";root.dataset.theme=n;try{localStorage.setItem("fat-theme",n)}catch(e){}};

// nav lists
const cv=c=>`var(--${c})`;
P.forEach((p,i)=>{
  const li=document.createElement("li"), a=document.createElement("a");
  a.href="#"+p.id;a.style.setProperty("--c",cv(p.color));a.dataset.i=i;
  a.innerHTML=`<i></i><span></span><small></small>`;
  a.children[1].textContent=p.name;a.children[2].textContent=p.pages.length+" pp";
  li.appendChild(a);$("sl").appendChild(li);
  const t=document.createElement("a");t.href="#"+p.id;t.textContent=p.name;t.style.setProperty("--c",cv(p.color));t.dataset.i=i;$("tabs").appendChild(t);
});

function heading(txt){
  const h=$("h");h.textContent="";h.setAttribute("aria-label",txt);let k=0;
  txt.split(" ").forEach(w=>{const s=document.createElement("span");s.className="w";s.setAttribute("aria-hidden","true");
    [...w].forEach(ch=>{const l=document.createElement("span");l.className="l";l.style.setProperty("--i",k++);l.textContent=ch;s.appendChild(l)});h.appendChild(s)});
}

function show(i,fromHash){
  cur=i;const p=P[i];root.dataset.c=p.color;mark=null;
  document.title=p.name+" · OS FAT Papers";
  heading(p.name.replace(" · "," "));
  $("full").textContent=`Final Assessment Test · Operating Systems · ${p.exam}`;
  const f=$("facts");f.textContent="";
  [`Slot ${p.slot}`,`${p.pages.length} pages`,`${p.rows.length} questions`].forEach(x=>{const s=document.createElement("span");s.textContent=x;f.appendChild(s)});
  const pd=document.createElement("a");pd.href=p.pdf;pd.target="_blank";pd.rel="noopener";pd.textContent="Original PDF";f.appendChild(pd);
  const R=document.createElement("ol");
  p.rows.forEach(r=>{const li=document.createElement("li"),b=document.createElement("button");b.className="row";b.type="button";
    b.innerHTML=`<span class="n"></span><span><span class="t"></span><span class="d"></span></span><span class="m"></span>`;
    b.querySelector(".n").textContent=r.n;b.querySelector(".t").textContent=r.t;b.querySelector(".d").textContent=r.d;b.querySelector(".m").textContent="Page "+r.pg;
    b.setAttribute("aria-label",`Question ${r.n}, ${r.t}, page ${r.pg}`);
    b.onclick=()=>go(r.n);li.appendChild(b);R.appendChild(li)});
  const G=$("pages");G.textContent="";
  p.pages.forEach((g,k)=>{const d=document.createElement("div");d.className="pg";d.id="pg"+(k+1);
    const im=new Image();im.src=g.src;im.width=g.w;im.height=g.h;im.alt=`${p.name}, page ${k+1} of ${p.pages.length}`;im.loading=k<2?"eager":"lazy";im.decoding="async";
    d.style.aspectRatio=g.w+"/"+g.h;d.appendChild(im);G.appendChild(d)});
  const pn=$("pn");pn.textContent="";
  const pv=P[i-1],nx=P[i+1];
  [[pv,"Previous paper",""],[nx,"Next paper","nx"]].forEach(([q,l,c])=>{if(!q)return;const a=document.createElement("a");a.href="#"+q.id;a.className=c;a.style.setProperty("--c",cv(q.color));
    a.innerHTML=`<span></span><b></b>`;a.children[0].textContent=l;a.children[1].textContent=q.name;pn.appendChild(a)});
  document.querySelectorAll("#sl a,#tabs a").forEach(a=>a.setAttribute("aria-current",String(+a.dataset.i===i)));
  const at=document.querySelector("#tabs a[aria-current=true]");if(at&&!wide())at.scrollIntoView({inline:"center",block:"nearest"});
  $("q").value="";status("Press / to search");
  if(!fromHash)window.scrollTo(0,0);
}

function status(h,plain){const s=$("st");s.textContent="";if(plain){s.textContent=h;return}s.innerHTML=h}

function find(raw){
  const m=raw.trim().toLowerCase().replace(/^q(uestion)?\.?\s*/,"").match(/^0*(\d{1,2})\s*[.\-\s]?\s*\(?([a-z])?\)?\s*$/);
  if(!m)return null;const p=P[cur];
  const key=m[1]+(m[2]||"");
  if(p.q[key])return{key:m[1]+(m[2]||""),pos:p.q[key]};
  if(m[2]&&p.q[m[1]])return{key:m[1],pos:p.q[m[1]],fell:true};
  return{miss:m[1]};
}

function go(raw,quiet){
  const r=find(String(raw));const p=P[cur];
  if(!raw||!String(raw).trim()){status("Press / to search");return false}
  if(!r){status("Type a number such as 5 or 9b",true);return false}
  if(r.miss){status(`No question ${r.miss} in this paper. It has 1–${p.rows.length}.`,true);return false}
  const [pg,y]=r.pos,el=$("pg"+pg);if(!el)return false;
  if(mark)mark.remove();
  mark=document.createElement("div");mark.className="mark";mark.style.top=(y*100)+"%";
  const b=document.createElement("b");b.textContent="Q"+r.key.toUpperCase();mark.appendChild(b);el.appendChild(mark);const mk=mark;clearTimeout(window.__mt);window.__mt=setTimeout(()=>{mk.style.opacity=0;setTimeout(()=>mk.remove(),250)},2200);
  const top=el.getBoundingClientRect().top+scrollY+y*el.getBoundingClientRect().height-(wide()?90:110);
  scrollTo({top:Math.max(0,top),behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
  status(`<em>Q${r.key.toUpperCase()}</em> · page ${pg} of ${p.pages.length}`);
  return true;
}

let tm;
$("q").addEventListener("input",e=>{clearTimeout(tm);const v=e.target.value;tm=setTimeout(()=>go(v),380)});
$("f").addEventListener("submit",e=>{e.preventDefault();clearTimeout(tm);go($("q").value)});

// routing
function route(first){const id=location.hash.slice(1);let i=P.findIndex(p=>p.id===id);const bad=i<0;if(bad)i=0;
  show(i,first);if(!first&&wide())$("side").classList.add("off");}
addEventListener("hashchange",()=>route(false));
document.querySelectorAll("#sl a").forEach(a=>a.addEventListener("click",()=>{if(wide())setTimeout(()=>$("side").classList.add("off"),0)}));

// sidebar auto-hide
addEventListener("mousemove",e=>{if(wide()&&e.clientX<56)$("side").classList.remove("off")});
document.addEventListener("mouseleave",e=>{if(wide()&&e.clientX<=2)$("side").classList.remove("off")});
document.addEventListener("mouseout",e=>{if(!e.relatedTarget&&e.clientX<=2&&wide())$("side").classList.remove("off")});

// keys
addEventListener("keydown",e=>{
  const t=e.target,typing=t&&(t.tagName==="INPUT"||t.isContentEditable);
  if(e.key==="Escape"&&t===$("q")){$("q").value="";$("q").blur();status("Press / to search");return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="/"){e.preventDefault();$("q").focus();return}
  const dir=(e.key==="ArrowRight"||e.key==="j")?1:(e.key==="ArrowLeft"||e.key==="k")?-1:0;
  if(dir){const n=cur+dir;if(P[n]){location.hash=P[n].id}}
});

if(!location.hash)history.replaceState(null,"","#"+P[0].id);
route(true);
</script>
